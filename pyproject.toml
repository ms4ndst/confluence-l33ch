[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-l33ch"
description = "Catppuccin-themed Windows GUI for exporting Confluence spaces and page trees to Markdown or PDF."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Magnus Sandström" }]
keywords = ["confluence", "export", "markdown", "pdf", "gui", "catppuccin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dynamic = ["version"]
dependencies = [
    "PySide6>=6.10",
    "requests>=2.31",
]

[project.optional-dependencies]
# Local Markdown → PDF rendering. Not required for the Confluence export
# itself (the "PDF" format asks the server for its own render), so it stays
# optional — and wkhtmltopdf is a separate native install either way.
pdf = ["markdown>=3.5", "pdfkit>=1.0"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# gui-scripts (not scripts) so Windows installs a `pythonw.exe`-based
# launcher: double-clicking or running `confluence-l33ch` does NOT spawn a
# console window behind the Qt UI. Treated the same as [project.scripts]
# on macOS / Linux.
[project.gui-scripts]
confluence-l33ch = "app.main:main"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]
